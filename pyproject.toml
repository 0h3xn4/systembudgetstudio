[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "system-budget-studio"
version = "0.1.0"
description = "Offline desktop tool for satellite power budgets and RF link budgets."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6-Essentials>=6.8,<6.9",
    "pydantic>=2.9,<3",
    "ruamel.yaml>=0.18,<0.20",
    "pint>=0.24,<0.27",
    "openpyxl>=3.1,<4",
    "reportlab>=4.2,<5",
    "numpy>=1.26,<3",
    "sgp4>=2.23,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "pypdf>=5",
    "jsonschema>=4.23",
    "mypy>=1.11",
    "ruff>=0.6",
    "pyinstaller>=6.10",
    "cyclonedx-bom>=4.5",
    "pip-licenses>=5",
    "pip-audit>=2.7",
    "pip-tools>=7.4",
]

[project.scripts]
budget = "budget_cli.main:main"

[project.gui-scripts]
system-budget-studio = "budget_gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_core", "src/budget_cli", "src/budget_gui"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "budget_core/assets"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"src/budget_gui/*" = ["N802"]  # Qt method names

[tool.ruff.lint.isort]
known-first-party = ["budget_core", "budget_cli", "budget_gui", "tests"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["budget_core", "budget_cli", "budget_gui"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "ruamel.*", "pint.*", "jsonschema.*", "openpyxl.*", "reportlab.*", "pypdf.*", "sgp4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gui: needs a Qt platform (run with QT_QPA_PLATFORM=offscreen)",
    "perf: performance targets",
]
