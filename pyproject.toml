[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "system-budget-studio"
version = "0.1.0"
description = "Offline desktop tool for satellite power budgets and RF link budgets."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6-Essentials>=6.8,<6.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "pyinstaller>=6.10",
    "cyclonedx-bom>=4.5",
    "pip-licenses>=5",
    "pip-audit>=2.7",
    "pip-tools>=7.4",
]

[project.scripts]
budget = "budget_cli.main:main"

[project.gui-scripts]
system-budget-studio = "budget_gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_core", "src/budget_cli", "src/budget_gui"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "budget_gui/assets"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["budget_core", "budget_cli", "budget_gui"]

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gui: needs a Qt platform (run with QT_QPA_PLATFORM=offscreen)",
    "perf: performance targets",
]
